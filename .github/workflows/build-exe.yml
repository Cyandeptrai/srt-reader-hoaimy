name: Build EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller "edge-tts>=7.3.1" pydub

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "SRT-Reader-HoaiMy" SRT-Reader-HoaiMy.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SRT-Reader-HoaiMy-exe
          path: dist/SRT-Reader-HoaiMy.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: SRT-Reader-HoaiMy-exe
          path: release

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "release/SRT-Reader-HoaiMy.exe" --title "SRT Reader HoaiMy $tag" --notes "SRT Reader HoaiMy $tag. Doc file SRT bang giong Microsoft Edge TTS mien phi (HoaiMy/NamMinh), khong can API key. Chay truc tiep file SRT-Reader-HoaiMy.exe, khong can cai dat. v1.3: chan nut Kiem tra giong/Kiem tra cap nhat/Chon file trong luc dang xuat (chi de nut Huy); nut Huy dung sau cau hien tai, van luu cac cau da xong; nut Tiep tuc doc not tu cau chua xong va noi vao file cu; nut Sub lai tu dau doc lai tu cau 1, tao thu muc moi (1), (2)... khong ghi de; GOP DAN: moi cau xong la ghep ngay vao file long tieng (dung timestamp SRT), huy/loi giua chung van giu cac cau da xong; cau loi khong lam hong file gop (de lang o slot cua no, chi log 1 dong ngan); nut Nghe thu PLAY phat ra loa ngay trong tool + nut Dung; them giong may (cu) SAPI tren Windows; toc do doi sang he so nhan 0.5x-2.0x (mac dinh 1.00x, giong trang web test); sua loi tu cap nhat: kiem chung file .new (kich thuoc + PE + PyInstaller + python311.dll) truoc khi thay, sao luu exe cu thanh .bak."
