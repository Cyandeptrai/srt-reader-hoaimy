name: Build EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller "edge-tts>=7.3.1" pydub

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "SRT-Reader-HoaiMy" SRT-Reader-HoaiMy.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SRT-Reader-HoaiMy-exe
          path: dist/SRT-Reader-HoaiMy.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: SRT-Reader-HoaiMy-exe
          path: release

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "release/SRT-Reader-HoaiMy.exe" --title "SRT Reader HoaiMy $tag" --notes "SRT Reader HoaiMy $tag. Doc file SRT bang giong Microsoft Edge TTS mien phi (HoaiMy/NamMinh), khong can API key. Chay truc tiep file SRT-Reader-HoaiMy.exe, khong can cai dat. v1.5: chuan hoa dinh dang MP3 dau ra ve 44.1kHz stereo 192k libmp3lame (file gop cuoi + file cau qua atempo + file giong may + cau dai noi bang pydub) - sua loi file v1.4 (24kHz mono) import vao Concat bi ffmpeg bao 'filter output failed: Invalid argument'; giu nguyen toan bo tinh nang v1.4 (toc do tu dong tung cau, ghep dan, chan nut, Huy van luu, Tiep tuc, Sub lai tu dau, Nghe thu PLAY, giong may, toc do he so nhan)."
